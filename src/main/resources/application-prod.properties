# ── Database (PostgreSQL) ─────────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.h2.console.enabled=false
# ── JWT ───────────────────────────────────────────────────────────────────────
jwt-secret=${JWT_SECRET_KEY}
jwt-expiration-ms=86400000
# ── Email ─────────────────────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MY_EMAIL}
spring.mail.password=${API_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=${MY_EMAIL}
# ── Cloudinary ────────────────────────────────────────────────────────────────
cloudinary.cloud_name=${API_CLOUDNAME}
cloudinary.api_key=${CLOUDINARY_KEY}
cloudinary.api_secret=${API_SECRET}
# ── App ───────────────────────────────────────────────────────────────────────
site.base.url=${APP_BASE_URL}
