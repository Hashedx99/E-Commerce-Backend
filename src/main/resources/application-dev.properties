# ── Database (H2 in-memory) ──────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:ecombend
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# ── JWT ───────────────────────────────────────────────────────────────────────
# Generate with: openssl rand -base64 32
jwt-secret=${JWT_SECRET_KEY}
jwt-expiration-ms=86400000
# ── Email ─────────────────────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MY_EMAIL}
spring.mail.password=${API_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=${MY_EMAIL}
# ── Cloudinary ────────────────────────────────────────────────────────────────
cloudinary.cloud_name=${API_CLOUDNAME}
cloudinary.api_key=${CLOUDINARY_KEY}
cloudinary.api_secret=${API_SECRET}
# ── File storage (local disk for dev) ────────────────────────────────────────
storage.base-path=/tmp/ecombend/uploads
storage.base-url=http://localhost:8080/files
# ── App ───────────────────────────────────────────────────────────────────────
site.base.url=http://localhost:8080
